<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Review | WDD 131</title>
  <meta name="description" content="Review a product by rating its performance, installation date, and useful features." />
  <meta name="author" content="Matheus Nascimento" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/product-review.css" />
  <script src="scripts/getdates.js" defer></script>
  <script src="scripts/product-review.js" defer></script>
</head>
<body class="review-page">
  <header>
    <span id="course-title">WDD 131: Dynamic Web Fundamentals</span>
  </header>
  <main class="review-main">
    <h1>Product Review</h1>
    <form action="review.html" method="get">
      <div class="form-field">
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="rating-field form-field">
        <legend>Overall Rating</legend>
        <div class="rating-options">
          <label for="rating-1">
            <input id="rating-1" name="rating" type="radio" value="1" required />
            <span class="rating-stars" aria-hidden="true">★</span>
            <span class="visually-hidden">1 star</span>
          </label>
          <label for="rating-2">
            <input id="rating-2" name="rating" type="radio" value="2" required />
            <span class="rating-stars" aria-hidden="true">★★</span>
            <span class="visually-hidden">2 stars</span>
          </label>
          <label for="rating-3">
            <input id="rating-3" name="rating" type="radio" value="3" required />
            <span class="rating-stars" aria-hidden="true">★★★</span>
            <span class="visually-hidden">3 stars</span>
          </label>
          <label for="rating-4">
            <input id="rating-4" name="rating" type="radio" value="4" required />
            <span class="rating-stars" aria-hidden="true">★★★★</span>
            <span class="visually-hidden">4 stars</span>
          </label>
          <label for="rating-5">
            <input id="rating-5" name="rating" type="radio" value="5" required />
            <span class="rating-stars" aria-hidden="true">★★★★★</span>
            <span class="visually-hidden">5 stars</span>
          </label>
        </div>
      </fieldset>

      <div class="form-field">
        <label for="installation-date">Date of Installation</label>
        <input id="installation-date" name="installationDate" type="date" required />
      </div>

      <fieldset class="features-field form-field">
        <legend>Which features did you find useful in the product?</legend>
        <p class="field-note">Select all that apply</p>
        <label for="feature-durability"><input id="feature-durability" name="features" type="checkbox" value="Durability" /> Durability</label>
        <label for="feature-ease"><input id="feature-ease" name="features" type="checkbox" value="Ease of Use" /> Ease of Use</label>
        <label for="feature-performance"><input id="feature-performance" name="features" type="checkbox" value="Performance" /> Performance</label>
        <label for="feature-design"><input id="feature-design" name="features" type="checkbox" value="Design" /> Design</label>
      </fieldset>

      <div class="form-field">
        <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="written-review" name="writtenReview" rows="5"></textarea>
      </div>

      <div class="form-field">
        <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
        <input id="user-name" name="userName" type="text" autocomplete="name" />
      </div>

      <input class="submit-button" type="submit" value="Post Review" />
    </form>
  </main>

  <footer class="review-footer">
    <p>&copy;<span id="currentyear"></span> Matheus Nascimento &middot; São Paulo, Brazil</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
